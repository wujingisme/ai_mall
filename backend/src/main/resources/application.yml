spring:
  application:
    name: mall-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}

auth:
  # 生产环境必须通过环境变量提供至少 32 字节的随机密钥。
  jwt-secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
  access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
  refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:604800}
  max-login-failures: ${MAX_LOGIN_FAILURES:5}
  lock-seconds: ${LOGIN_LOCK_SECONDS:900}

wechat:
  mini-program:
    # AppSecret 只能由后端环境变量提供，绝不能写入小程序包。
    app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
    app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}

mall:
  pickup:
    # 第一版只有一个固定取货点；创建订单时会把这两个值复制到订单快照。
    location-name: ${PICKUP_LOCATION_NAME:AI Mall 默认取货点}
    location-address: ${PICKUP_LOCATION_ADDRESS:请在后台配置线下取货地址}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
