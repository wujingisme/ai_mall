openapi: 3.0.3
info:
  title: AI Mall API
  version: 1.1.0
  description: 商城商品与认证 API；本文件是前后端并行开发的唯一接口契约
x-development-conventions:
  code-comments:
    required: true
    scope: frontend-and-backend
    rule: 关键业务逻辑、认证流程、安全校验、异常分支和复杂算法必须添加中文注释，说明设计意图；避免只复述代码表面行为。
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: AdminAccounts
  - name: AdminCustomers
  - name: CouponTemplates
  - name: CouponGrants
  - name: MyCoupons
  - name: Shop
  - name: Cart
  - name: Orders
  - name: Products
paths:
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: 查询当前用户购物车
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: 加入购物车；商品已存在时累加数量
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CartItemAddRequest' } } }
      responses:
        '200':
          description: 添加成功
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cart]
      summary: 清空当前用户购物车
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 清空成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/cart/items/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
    put:
      tags: [Cart]
      summary: 修改购物车商品数量
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CartItemQuantityRequest' } } }
      responses:
        '200':
          description: 修改成功
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cart]
      summary: 从购物车删除商品
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 删除成功；商品不在购物车时同样成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orders/preview:
    post:
      tags: [Orders]
      summary: 预览线上订单
      operationId: previewOrder
      description: 重新读取当前用户购物车和商品价格，计算线下取货订单金额；不创建订单、不锁库存、不接支付。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderPreviewRequest' } } }
      responses:
        '200':
          description: 预览成功
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPreview' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: 创建线上订单
      operationId: createOrder
      description: 在事务中校验购物车、锁定商品预留库存、保存商品快照并删除已下单购物车条目；线下取货时付款，不接入真实支付。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreateRequest' } } }
      responses:
        '200':
          description: 创建成功；首次创建返回明文取货码，幂等重试时 pickupCode 为空且 replayed 为 true
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreateResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/orders:
    get:
      tags: [Orders]
      summary: 查询我的订单
      operationId: listMyOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/orders/{id}:
    get:
      tags: [Orders]
      summary: 查询我的订单详情
      operationId: getMyOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/orders/{id}/cancellation:
    post:
      tags: [Orders]
      summary: 取消我的订单
      operationId: cancelMyOrder
      description: 仅允许取消待取货订单；取消和释放预留库存位于同一事务，重复取消返回当前订单快照。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: 取消成功或重复取消
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/orders:
    get:
      tags: [Orders]
      summary: 后台分页查询订单
      operationId: listAdminOrders
      description: 管理员按状态、订单号或客户 ID 查询全部订单；响应只包含客户展示摘要和订单快照字段，不返回密码、微信身份或取货码哈希。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: orderNo, in: query, schema: { type: string, maxLength: 40 } }
        - { name: userId, in: query, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrderPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/orders/{id}:
    get:
      tags: [Orders]
      summary: 后台查询订单详情
      operationId: getAdminOrder
      description: 查询订单主表和下单时保存的商品快照；取货码只在后续核销接口中提交验证，详情不会返回明文或哈希。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrderDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/orders/{id}/pickup-verification:
    post:
      tags: [Orders]
      summary: 后台核销线下取货订单
      operationId: verifyAdminOrderPickup
      description: 校验 8 位取货码；成功后在同一事务中将订单改为 PICKED_UP，并把 stock 与 reserved_stock 同时扣减。重复核销在取货码正确时幂等返回当前订单详情。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PickupVerificationRequest' } } }
      responses:
        '200':
          description: 核销成功或已核销订单重复请求
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrderDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/shop/products:
    get:
      tags: [Shop]
      summary: 消费者分页浏览已上架商品
      operationId: listShopProducts
      security: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: keyword, in: query, description: 按商品名称搜索, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/ShopProductPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/shop/products/{id}:
    get:
      tags: [Shop]
      summary: 获取已上架商品的消费者详情
      operationId: getShopProduct
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/ShopProductDetail' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册商城账号
      operationId: register
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '201':
          description: 注册成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 用户名已存在
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 账号密码登录
      operationId: login
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: 登录成功
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/AccountLocked' }
  /api/v1/auth/wechat/login:
    post:
      tags: [Auth]
      summary: 微信小程序登录
      description: 使用 wx.login/uni.login 获取的一次性 code 换取商城会话；首次登录会创建 CUSTOMER 用户。
      operationId: loginWithWechat
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WechatLoginRequest' } } }
      responses:
        '200':
          description: 登录成功
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 微信临时登录凭证无效、过期或兑换失败
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: 微信登录尚未正确配置、微信服务不可用或响应无法安全解析
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌（刷新令牌单次使用）
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshTokenRequest' } } }
      responses:
        '200':
          description: 刷新成功，同时轮换 accessToken 和 refreshToken
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前会话
      operationId: logout
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshTokenRequest' } } }
      responses:
        '204': { description: 已退出；重复调用也返回 204 }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 获取当前登录用户
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/accounts:
    post:
      tags: [AdminAccounts]
      summary: 超级管理员创建后台账号
      description: 仅 SUPER_ADMIN 可调用；只能创建 ADMIN 或 OPERATOR，不能通过接口创建超级管理员。
      operationId: createAdminAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountCreateRequest' } } }
      responses:
        '201':
          description: 后台账号创建成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 用户名已存在
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/v1/admin/coupon-templates:
    get:
      tags: [CouponTemplates]
      summary: 分页查询优惠券模板
      operationId: listCouponTemplates
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: keyword, in: query, description: 按模板名称搜索, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CouponTemplateStatus' } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplatePage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CouponTemplates]
      summary: 创建优惠券模板草稿
      operationId: createCouponTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplateWriteRequest' } } }
      responses:
        '201':
          description: 创建成功，初始状态为 DRAFT
          content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplate' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/coupon-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
    get:
      tags: [CouponTemplates]
      summary: 查询优惠券模板详情
      operationId: getCouponTemplate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplate' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CouponTemplateNotFound' }
    put:
      tags: [CouponTemplates]
      summary: 完整修改优惠券模板草稿
      description: 只有 DRAFT 可以修改；PUT 完整替换所有可编辑字段并清除另一种有效期模式的字段。
      operationId: updateCouponTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplateWriteRequest' } } }
      responses:
        '200':
          description: 修改成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplate' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CouponTemplateNotFound' }
        '409': { $ref: '#/components/responses/CouponTemplateStateConflict' }
  /api/v1/admin/coupon-templates/{id}/activation:
    post:
      tags: [CouponTemplates]
      summary: 启用优惠券模板
      description: 只有 DRAFT 可以启用；重复启用已是 ACTIVE 的模板保持幂等。
      operationId: activateCouponTemplate
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '200':
          description: 启用成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplate' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CouponTemplateNotFound' }
        '409': { $ref: '#/components/responses/CouponTemplateStateConflict' }
  /api/v1/admin/coupon-templates/{id}/deactivation:
    post:
      tags: [CouponTemplates]
      summary: 停用优惠券模板
      description: 只有 ACTIVE 可以停用；重复停用已是 DISABLED 的模板保持幂等，且不会作废未来已经发给用户的券。
      operationId: deactivateCouponTemplate
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '200':
          description: 停用成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CouponTemplate' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CouponTemplateNotFound' }
        '409': { $ref: '#/components/responses/CouponTemplateStateConflict' }
  /api/v1/admin/coupon-grants:
    post:
      tags: [CouponGrants]
      summary: 管理员向指定商城用户人工发放优惠券
      description: 仅启用且未过期的模板可发放；幂等键相同且请求内容一致时返回原发放结果。
      operationId: createCouponGrant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CouponGrantRequest' } } }
      responses:
        '201':
          description: 发放成功，或返回同一幂等请求的既有成功结果
          content: { application/json: { schema: { $ref: '#/components/schemas/CouponGrant' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CouponTemplateNotFound' }
        '409': { $ref: '#/components/responses/CouponGrantConflict' }
  /api/v1/admin/customers:
    get:
      tags: [AdminCustomers]
      summary: 搜索可接收优惠券的启用商城用户
      description: 只返回后台选择用户所需的摘要，不返回微信 OpenID 等身份字段。
      operationId: listAdminCustomers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 100 }, description: 按登录名或显示名称搜索 }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/customers/manage:
    get:
      tags: [AdminCustomers]
      summary: 分页查询商城用户
      operationId: listAdminUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 100 } }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/customers/manage/{id}:
    get:
      tags: [AdminCustomers]
      summary: 查看商城用户详情
      operationId: getAdminUser
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }]
      responses:
        '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /api/v1/admin/customers/manage/{id}/activation:
    post:
      tags: [AdminCustomers]
      summary: 启用商城用户
      operationId: activateAdminUser
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }]
      responses:
        '200': { description: 操作成功, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '404': { $ref: '#/components/responses/UserNotFound' }
  /api/v1/admin/customers/manage/{id}/deactivation:
    post:
      tags: [AdminCustomers]
      summary: 停用商城用户
      operationId: deactivateAdminUser
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }]
      responses:
        '200': { description: 操作成功, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '404': { $ref: '#/components/responses/UserNotFound' }
  /api/v1/admin/customers/manage/{id}/coupons:
    get:
      tags: [AdminCustomers]
      summary: 查看商城用户优惠券
      operationId: listAdminUserCoupons
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [AVAILABLE, USED, EXPIRED] } }
      responses:
        '200': { description: 查询成功, content: { application/json: { schema: { $ref: '#/components/schemas/UserCouponPage' } } } }
        '404': { $ref: '#/components/responses/UserNotFound' }
  /api/v1/me/coupons:
    get:
      tags: [MyCoupons]
      summary: 分页查询当前用户的优惠券
      operationId: listMyCoupons
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [AVAILABLE, USED, EXPIRED] } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/UserCouponPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/coupons/{id}:
    get:
      tags: [MyCoupons]
      summary: 查询当前用户的优惠券详情
      operationId: getMyCoupon
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/UserCoupon' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UserCouponNotFound' }
  /api/v1/me/coupon-shares:
    post:
      tags: [MyCoupons]
      summary: 为当前用户优惠券生成分享凭证
      operationId: createCouponShare
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CouponShareCreateRequest' } } }
      responses:
        '201': { description: 分享创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/CouponShareCreated' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/CouponShareConflict' }
  /api/v1/coupon-shares/resolve:
    post:
      tags: [MyCoupons]
      summary: 解析优惠券分享信息
      operationId: resolveCouponShare
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CouponTokenRequest' } } }
      responses:
        '200': { description: 解析成功, content: { application/json: { schema: { $ref: '#/components/schemas/CouponSharePreview' } } } }
        '404': { $ref: '#/components/responses/CouponShareNotFound' }
  /api/v1/coupon-claims:
    post:
      tags: [MyCoupons]
      summary: 当前用户领取优惠券分享
      operationId: claimCouponShare
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CouponTokenRequest' } } }
      responses:
        '200': { description: 领取成功或重复领取时返回已有优惠券, content: { application/json: { schema: { $ref: '#/components/schemas/UserCoupon' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CouponShareNotFound' }
        '409': { $ref: '#/components/responses/CouponShareConflict' }
  /api/v1/products:
    get:
      tags: [Products]
      summary: 分页查询商品
      operationId: listProducts
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: keyword, in: query, description: 按名称或 SKU 搜索, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Products]
      summary: 新增商品
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWriteRequest' } } }
      responses:
        '201':
          description: 创建成功
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[1-9][0-9]*$' }
    get:
      tags: [Products]
      summary: 获取商品详情
      operationId: getProduct
      responses:
        '200':
          description: 查询成功
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      summary: 编辑商品
      operationId: updateProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWriteRequest' } } }
      responses:
        '200':
          description: 更新成功
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Products]
      summary: 删除商品
      operationId: deleteProduct
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 删除成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CartItemAddRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, pattern: '^[1-9][0-9]*$' }
        quantity: { type: integer, minimum: 1, maximum: 99, example: 1 }
    CartItemQuantityRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CartItem:
      type: object
      required: [productId, name, price, quantity, stock, available]
      properties:
        productId: { type: string }
        name: { type: string }
        price: { type: number }
        imageUrl: { type: string, nullable: true }
        quantity: { type: integer }
        stock: { type: integer, description: 扣除待取货订单预留后的当前可售库存 }
        available: { type: boolean, description: 商品已上架且库存充足 }
    Cart:
      type: object
      required: [items, totalQuantity, totalAmount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        totalQuantity: { type: integer }
        totalAmount: { type: number }
    ShopProductListItem:
      type: object
      additionalProperties: false
      required: [id, name, price, soldOut]
      properties:
        id: { type: string, example: '1' }
        name: { type: string, example: 示例商品 }
        price: { type: number, multipleOf: 0.01, example: 99.00 }
        imageUrl: { type: string, format: uri, nullable: true }
        soldOut: { type: boolean, description: 是否售罄 }
    ShopProductDetail:
      allOf:
        - { $ref: '#/components/schemas/ShopProductListItem' }
        - type: object
          properties:
            description: { type: string, nullable: true }
    ShopProductPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ShopProductListItem' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password, displayName]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9_]+$', example: mall_user }
        password: { type: string, minLength: 6, maxLength: 72, format: password, example: '123456', description: 至少 6 位，不限制字符类型 }
        displayName: { type: string, minLength: 1, maxLength: 100, example: 商城用户 }
    AdminAccountCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password, displayName, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9_]+$', example: operator_01 }
        password: { type: string, minLength: 6, maxLength: 72, format: password, example: '123456' }
        displayName: { type: string, minLength: 1, maxLength: 100, example: 商品运营 }
        role: { type: string, enum: [ADMIN, OPERATOR], example: OPERATOR }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, example: admin }
        password: { type: string, minLength: 6, maxLength: 72, format: password, example: '123456', description: 至少 6 位，不限制字符类型 }
    WechatLoginRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: wx.login/uni.login 返回的一次性临时登录凭证；不能缓存或重复使用
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32 }
    TokenResponse:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, expiresIn, refreshToken, refreshExpiresIn, user]
      properties:
        tokenType: { type: string, enum: [Bearer] }
        accessToken: { type: string, description: 短期 JWT }
        expiresIn: { type: integer, format: int64, example: 900, description: accessToken 剩余有效秒数 }
        refreshToken: { type: string, description: 不透明的单次使用刷新令牌 }
        refreshExpiresIn: { type: integer, format: int64, example: 604800, description: refreshToken 剩余有效秒数 }
        user: { $ref: '#/components/schemas/CurrentUser' }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles]
      properties:
        id: { type: string, example: '1' }
        username: { type: string, example: admin }
        displayName: { type: string, example: 商城管理员 }
        avatarUrl: { type: string, format: uri, nullable: true }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [CUSTOMER, SUPER_ADMIN, ADMIN, OPERATOR] }
    MoneyString:
      type: string
      pattern: '^(0|[1-9][0-9]{0,7})(\.[0-9]{1,2})?$'
      example: '20.00'
      description: 十进制定点金额字符串，后端使用 BigDecimal 处理
    CouponTemplateStatus:
      type: string
      enum: [DRAFT, ACTIVE, DISABLED]
    CouponValidityType:
      type: string
      enum: [FIXED_RANGE, DAYS_AFTER_RECEIPT]
    CouponTemplateWriteRequest:
      type: object
      required: [name, couponType, minimumSpend, discountAmount, totalQuantity, perUserLimit, validityType, shareEnabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: 新人满减券 }
        couponType: { type: string, enum: [FIXED_AMOUNT], description: 首版仅支持满减券 }
        minimumSpend: { $ref: '#/components/schemas/MoneyString' }
        discountAmount: { $ref: '#/components/schemas/MoneyString' }
        totalQuantity: { type: integer, minimum: 1, maximum: 2147483647 }
        perUserLimit: { type: integer, minimum: 1, maximum: 2147483647 }
        validityType: { $ref: '#/components/schemas/CouponValidityType' }
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        validDays: { type: integer, minimum: 1, maximum: 3650, nullable: true }
        shareEnabled: { type: boolean }
      description: FIXED_RANGE 必须提供 validFrom/validUntil 且不提供 validDays；DAYS_AFTER_RECEIPT 规则相反。
    CouponTemplate:
      allOf:
        - { $ref: '#/components/schemas/CouponTemplateWriteRequest' }
        - type: object
          required: [id, issuedQuantity, status, createdAt, updatedAt]
          properties:
            id: { type: string, pattern: '^[1-9][0-9]*$' }
            issuedQuantity: { type: integer, minimum: 0 }
            status: { $ref: '#/components/schemas/CouponTemplateStatus' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CouponTemplatePage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CouponTemplate' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    CouponGrantRequest:
      type: object
      additionalProperties: false
      required: [templateId, targetUserId, quantity, reason, idempotencyKey]
      properties:
        templateId: { type: string, pattern: '^[1-9][0-9]*$' }
        targetUserId: { type: string, pattern: '^[1-9][0-9]*$' }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        reason: { type: string, minLength: 1, maxLength: 200 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
    CustomerSummary:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
    CustomerPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomerSummary' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    CouponGrant:
      type: object
      required: [id, templateId, targetUserId, operatorUserId, requestedQuantity, successQuantity, reason, idempotencyKey, status, createdAt]
      properties:
        id: { type: string }
        templateId: { type: string }
        targetUserId: { type: string }
        operatorUserId: { type: string }
        requestedQuantity: { type: integer }
        successQuantity: { type: integer }
        reason: { type: string }
        idempotencyKey: { type: string }
        status: { type: string, enum: [SUCCESS] }
        createdAt: { type: string, format: date-time }
    UserCouponStatus:
      type: string
      enum: [AVAILABLE, USED, EXPIRED]
      description: EXPIRED 由 UNUSED 券的有效期实时派生，不作为独立数据库状态写入。
    UserCoupon:
      type: object
      required: [id, templateId, name, couponType, minimumSpend, discountAmount, validFrom, validUntil, status, source, createdAt]
      properties:
        id: { type: string }
        templateId: { type: string }
        name: { type: string }
        couponType: { type: string, enum: [FIXED_AMOUNT] }
        minimumSpend: { $ref: '#/components/schemas/MoneyString' }
        discountAmount: { $ref: '#/components/schemas/MoneyString' }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/UserCouponStatus' }
        source: { type: string, enum: [MANUAL, SHARE] }
        usedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    UserCouponPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserCoupon' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    AdminUser:
      allOf:
        - { $ref: '#/components/schemas/CustomerSummary' }
        - type: object
          required: [enabled, roles, wechatBound]
          properties:
            enabled: { type: boolean }
            roles: { type: string, example: CUSTOMER }
            wechatBound: { type: boolean, description: 是否绑定微信，不返回 OpenID }
            createdAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time, nullable: true }
    AdminUserPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    CouponShareCreateRequest:
      type: object
      required: [userCouponId]
      properties: { userCouponId: { type: string, pattern: '^[1-9][0-9]*$' } }
    CouponTokenRequest:
      type: object
      required: [shareToken]
      properties: { shareToken: { type: string, minLength: 1, maxLength: 128 } }
    CouponShareCreated:
      type: object
      required: [shareToken, sharePath, expiresAt]
      properties:
        shareToken: { type: string }
        sharePath: { type: string }
        expiresAt: { type: string, format: date-time }
    CouponSharePreview:
      type: object
      required: [name, minimumSpend, discountAmount, expiresAt, claimable]
      properties:
        name: { type: string }
        minimumSpend: { $ref: '#/components/schemas/MoneyString' }
        discountAmount: { $ref: '#/components/schemas/MoneyString' }
        expiresAt: { type: string, format: date-time }
        claimable: { type: boolean }
    OrderStatus:
      type: string
      enum: [PENDING_PICKUP, PICKED_UP, CANCELLED]
      description: 订单状态；首版线上下单后由用户到固定取货点取货
    OrderPreviewItemRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, pattern: '^[1-9][0-9]*$', description: 商品 ID，只能选择当前用户购物车中的商品 }
        quantity: { type: integer, minimum: 1, maximum: 99, description: 本次购买数量，不能超过购物车数量 }
    OrderPreviewRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderPreviewItemRequest' }
      description: 只提交商品和数量；后端重新读取价格、状态和库存，不创建订单、不锁库存、不接支付
    OrderCreateItemRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, pattern: '^[1-9][0-9]*$', description: 商品 ID，只能选择当前用户购物车中的商品 }
        quantity: { type: integer, minimum: 1, maximum: 99, description: 本次购买数量，不能超过购物车数量 }
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [items, clientRequestId]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderCreateItemRequest' }
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
          description: 前端为一次提交生成并在网络重试时复用的幂等键
      description: 只提交购物车商品和幂等键；金额、价格、状态、用户归属和库存由后端决定
    OrderPreviewItem:
      type: object
      additionalProperties: false
      required: [productId, name, unitPrice, quantity, lineAmount, currentStock, available]
      properties:
        productId: { type: string }
        name: { type: string }
        unitPrice: { type: number, minimum: 0, multipleOf: 0.01 }
        quantity: { type: integer, minimum: 1 }
        lineAmount: { type: number, minimum: 0, multipleOf: 0.01 }
        currentStock: { type: integer, minimum: 0, description: 扣除待取货订单预留后的当前可售库存 }
        available: { type: boolean, description: 当前上架且库存满足本次数量 }
    OrderPreview:
      type: object
      additionalProperties: false
      required: [items, pickupLocationName, pickupLocationAddress, totalQuantity, totalAmount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OrderPreviewItem' } }
        pickupLocationName: { type: string }
        pickupLocationAddress: { type: string }
        totalQuantity: { type: integer, minimum: 1 }
        totalAmount: { type: number, minimum: 0, multipleOf: 0.01 }
    OrderItem:
      type: object
      additionalProperties: false
      required: [sku, productName, unitPrice, quantity, lineAmount]
      properties:
        productId: { type: string, nullable: true }
        sku: { type: string }
        productName: { type: string }
        unitPrice: { type: number, minimum: 0, multipleOf: 0.01 }
        quantity: { type: integer, minimum: 1 }
        lineAmount: { type: number, minimum: 0, multipleOf: 0.01 }
    OrderSummary:
      type: object
      additionalProperties: false
      required: [id, orderNo, status, pickupLocationName, itemQuantity, totalAmount, createdAt]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        orderNo: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        pickupLocationName: { type: string }
        itemQuantity: { type: integer, minimum: 1 }
        totalAmount: { type: number, minimum: 0, multipleOf: 0.01 }
        createdAt: { type: string, format: date-time }
    OrderDetail:
      type: object
      additionalProperties: false
      required: [id, orderNo, status, pickupLocationName, pickupLocationAddress, itemQuantity, totalAmount, items, createdAt]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        orderNo: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        pickupLocationName: { type: string }
        pickupLocationAddress: { type: string }
        itemQuantity: { type: integer, minimum: 1 }
        totalAmount: { type: number, minimum: 0, multipleOf: 0.01 }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderItem' } }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        pickedUpAt: { type: string, format: date-time, nullable: true }
    OrderCreateResponse:
      type: object
      additionalProperties: false
      required: [order, replayed]
      properties:
        order: { $ref: '#/components/schemas/OrderDetail' }
        pickupCode: { type: string, nullable: true, description: 仅首次创建成功响应返回的明文取货码 }
        replayed: { type: boolean, description: 是否复用了同一幂等键对应的已有订单 }
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    AdminOrderSummary:
      type: object
      additionalProperties: false
      required: [id, orderNo, userId, status, pickupLocationName, itemQuantity, totalAmount, createdAt]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        orderNo: { type: string }
        userId: { type: string, nullable: true }
        username: { type: string, nullable: true, description: 客户账号；后台展示用途，不是权限依据 }
        displayName: { type: string, nullable: true, description: 客户展示名称 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        pickupLocationName: { type: string }
        itemQuantity: { type: integer, minimum: 0 }
        totalAmount: { type: number, minimum: 0, multipleOf: 0.01 }
        createdAt: { type: string, format: date-time }
    AdminOrderDetail:
      type: object
      additionalProperties: false
      required: [id, orderNo, userId, status, pickupLocationName, pickupLocationAddress, itemQuantity, totalAmount, items, createdAt]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        orderNo: { type: string }
        userId: { type: string, nullable: true }
        username: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/OrderStatus' }
        pickupLocationName: { type: string }
        pickupLocationAddress: { type: string }
        itemQuantity: { type: integer, minimum: 0 }
        totalAmount: { type: number, minimum: 0, multipleOf: 0.01 }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderItem' } }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        pickedUpAt: { type: string, format: date-time, nullable: true }
    AdminOrderPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminOrderSummary' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    PickupVerificationRequest:
      type: object
      additionalProperties: false
      required: [pickupCode]
      properties:
        pickupCode:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjklmnpqrstuvwxyz]+$'
          description: 用户首次下单响应中获得的 8 位取货码；后端只计算摘要，不保存明文
    ProductStatus:
      type: integer
      enum: [0, 1]
      description: 0 下架，1 上架
    ProductWriteRequest:
      type: object
      required: [sku, name, price, stock, status]
      properties:
        sku: { type: string, minLength: 1, maxLength: 64, example: PHONE-001 }
        name: { type: string, minLength: 1, maxLength: 200, example: 示例商品 }
        price: { type: number, minimum: 0, multipleOf: 0.01, example: 1999.00 }
        stock: { type: integer, minimum: 0, maximum: 2147483647, example: 100 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        imageUrl: { type: string, maxLength: 1000, nullable: true }
        description: { type: string, nullable: true }
    ProductListItem:
      type: object
      required: [id, sku, name, price, stock, status, createdAt, updatedAt]
      properties:
        id: { type: string, example: '1' }
        sku: { type: string }
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
        status: { $ref: '#/components/schemas/ProductStatus' }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductDetail:
      allOf:
        - { $ref: '#/components/schemas/ProductListItem' }
        - type: object
          properties: { description: { type: string, nullable: true } }
    ProductPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductListItem' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    FieldError:
      type: object
      properties: { field: { type: string }, message: { type: string } }
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: string, example: PRODUCT_NOT_FOUND }
        message: { type: string, example: 商品不存在 }
        details: { type: array, nullable: true, items: { $ref: '#/components/schemas/FieldError' } }
        timestamp: { type: string, format: date-time }
  responses:
    BadRequest:
      description: 请求参数错误
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: 商品不存在
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: SKU 已存在
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalError:
      description: 服务端异常
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: 凭证错误、缺失、过期或已撤销
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: 已登录但权限不足或账号被禁用
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    AccountLocked:
      description: 登录失败次数过多，账号暂时锁定
      headers:
        Retry-After: { schema: { type: integer }, description: 建议等待秒数 }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CouponTemplateNotFound:
      description: 优惠券模板不存在
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CouponTemplateStateConflict:
      description: 优惠券模板当前状态不允许该操作，或并发操作导致状态已经变化
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CouponGrantConflict:
      description: 模板不可发放、发行量或限领不足，或幂等键冲突
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UserCouponNotFound:
      description: 优惠券不存在或不属于当前用户
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UserNotFound:
      description: 商城用户不存在
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CouponShareNotFound:
      description: 分享不存在或已失效
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CouponShareConflict:
      description: 分享不可领取、本人领取、库存不足或达到限领
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
