name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/mall-backend-deploy.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mall-backend-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn --batch-mode verify

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing repository secret DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing repository secret DEPLOY_PORT}"
          : "${DEPLOY_USER:?Missing repository secret DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing repository secret DEPLOY_PATH}"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_SSH_KEY:?Missing repository secret DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing repository secret DEPLOY_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Prepare remote directories
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases' '$DEPLOY_PATH/deploy'"

      - name: Upload artifact and deploy script
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_name="mall-backend-${GITHUB_SHA}.jar"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          scp -i "$HOME/.ssh/id_ed25519" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "backend/target/mall-backend-1.0.0.jar" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$artifact_name"
          scp -i "$HOME/.ssh/id_ed25519" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy/mall-backend-deploy.sh" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/mall-backend-deploy.sh"

      - name: Restart backend and run health check
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_script="$DEPLOY_PATH/deploy/mall-backend-deploy.sh"
          staged_jar="$DEPLOY_PATH/releases/$ARTIFACT_NAME"
          if [ "$DEPLOY_USER" = "root" ]; then
            remote_command="bash '$remote_script' '$staged_jar'"
          else
            remote_command="sudo -n bash '$remote_script' '$staged_jar'"
          fi
          ssh -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
