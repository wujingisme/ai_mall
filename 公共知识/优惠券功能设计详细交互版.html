<div id="coupon-mainstream-viz">
  <style>
    #coupon-mainstream-viz{color:var(--foreground)}#coupon-mainstream-viz .tabs{margin-bottom:14px}#coupon-mainstream-viz .flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}#coupon-mainstream-viz .stage{padding:12px;min-height:112px;border-radius:10px;background:color-mix(in srgb,var(--viz-series-1) 10%,transparent)}#coupon-mainstream-viz .stage.future{background:color-mix(in srgb,var(--viz-series-2) 10%,transparent)}#coupon-mainstream-viz .stage h3{margin:0 0 7px;font-weight:500}#coupon-mainstream-viz .stage p{margin:0;color:var(--muted-foreground)}#coupon-mainstream-viz .stage .viz-badge{margin-top:10px}#coupon-mainstream-viz .detail{margin-top:14px}#coupon-mainstream-viz .detail strong{font-weight:500}#coupon-mainstream-viz .detail p{margin:7px 0}#coupon-mainstream-viz .detail code{display:block;white-space:normal}#coupon-mainstream-viz .qa{margin:14px 0 0;padding-left:18px}#coupon-mainstream-viz .qa li{margin:6px 0}@media(max-width:760px){#coupon-mainstream-viz .flow{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){#coupon-mainstream-viz .flow{grid-template-columns:1fr}}
  </style>
  <h2>主流电商优惠券生命周期</h2>
  <div class="viz-controls tabs" aria-label="选择视角">
    <button type="button" class="btn btn-primary" aria-pressed="true" data-view="lifecycle">生命周期</button>
    <button type="button" class="btn" aria-pressed="false" data-view="data">数据与状态</button>
    <button type="button" class="btn" aria-pressed="false" data-view="risk">一致性与风险</button>
    <button type="button" class="btn" aria-pressed="false" data-view="project">本项目映射</button>
  </div>
  <div class="flow" id="cm-flow" role="list" aria-label="优惠券生命周期步骤"></div>
  <div class="card detail" aria-live="polite"><strong id="cm-title"></strong><p id="cm-text"></p><code id="cm-code"></code></div>
  <ul class="qa"><li><strong>主流闭环：</strong>生成/配置 → 发放/领取 → 可用 → 下单锁定 → 支付核销 → 取消释放或退款回补。</li><li><strong>设计重点：</strong>下单时锁券，支付成功才核销；取消订单释放锁定券，避免未支付却永久消耗。</li><li><strong>本项目边界：</strong>模板、人工发券、我的优惠券和分享领取已实现；订单锁券与核销等待订单模块。</li></ul>
  <script>
    (()=>{const root=document.getElementById('coupon-mainstream-viz'),flow=root.querySelector('#cm-flow'),title=root.querySelector('#cm-title'),text=root.querySelector('#cm-text'),code=root.querySelector('#cm-code');const data={lifecycle:{title:'生命周期：权益从创建走到售后',text:'主流设计将“可用”和“已使用”之间增加订单锁定状态，支付与售后决定最终核销或释放。',code:'DRAFT → ACTIVE → CLAIMED/ISSUED → AVAILABLE → LOCKED → USED；取消：LOCKED → AVAILABLE；退款：按规则回补',steps:[['配置','运营创建规则与发行量','模板'],['发放','领取、人工发放或活动赠送','用户券实例'],['可用','用户选择满足门槛的券','校验有效期/归属'],['锁定','创建订单时暂占优惠券','绑定 orderId'],['核销','支付成功后改为 USED','幂等核销'],['售后','取消释放；退款按分摊处理','价格快照']]},data:{title:'数据与状态：模板和实例分离',text:'模板管理公共规则和库存，用户券保存权益快照；订单侧保存使用时的价格与优惠分摊，避免售后重新按活动状态计算。',code:'coupon_template → user_coupon → order_coupon_snapshot → refund_allocation',steps:[['模板','金额、门槛、有效期、库存','DRAFT/ACTIVE/INACTIVE'],['用户券','用户、来源、快照、状态','AVAILABLE/LOCKED/USED'],['订单关联','订单号、锁定时间、核销时间','一单一券或明确叠加'],['分摊快照','优惠分摊到订单行','退款不重新计算'],['审计','操作人、来源、幂等键','可追溯'],['对账','发放、核销、回补数量','最终一致性']]},risk:{title:'一致性与风险：每个动作都要可重试',text:'主流方案通常把原子库存、状态机、唯一约束和幂等键组合使用；高并发场景还会用缓存原子扣减与数据库兜底。',code:'库存：条件更新/原子扣减；领取：唯一(userId,templateId)；核销：orderId 幂等；退款：分摊快照',steps:[['超发','库存扣减必须原子','条件 UPDATE 或 Lua'],['重复领取','同一用户不能多领','唯一约束 + 幂等'],['重复下单','同一券不能并发锁两单','状态 CAS + orderId'],['支付重试','回调可能重复到达','支付事件幂等'],['取消失败','券不能永久冻结','定时补偿/对账'],['退款争议','活动已结束也要算对','订单分摊快照']]},project:{title:'本项目映射：现在做到哪一步',text:'按渐进式批次交付：先把模板、发放和用户查询做好，再扩展分享，订单状态和资金影响留到订单模块。',code:'已实现：coupon_template / coupon_grant / user_coupon / coupon_share；规划：order_coupon_lock / redemption / refund',steps:[['批次二','模板创建、启用、停用','后端完成'],['批次三','人工发券、我的优惠券','完成'],['扩展','分享凭证与领取','代码完成，待验收'],['批次四','新微信用户自动发券','未开始'],['批次五','订单锁券与核销','等待订单模块'],['面试重点','快照 + 幂等 + 条件更新','解释取舍']]}};function render(k){const d=data[k];flow.innerHTML='';d.steps.forEach((s,i)=>{const n=document.createElement('div');n.className='stage'+(k==='project'&&i>3?' future':'');n.setAttribute('role','listitem');n.innerHTML='<h3>'+(i+1)+' · '+s[0]+'</h3><p class="text-small">'+s[1]+'</p><span class="viz-badge">'+s[2]+'</span>';flow.appendChild(n)});title.textContent=d.title;text.textContent=d.text;code.textContent=d.code}root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('[data-view]').forEach(x=>{const a=x===b;x.setAttribute('aria-pressed',String(a));x.classList.toggle('btn-primary',a)});render(b.dataset.view)}));render('lifecycle')})()
  </script>
</div>
